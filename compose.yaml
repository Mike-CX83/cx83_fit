name: personal-health-dashboard
services:
  app:
    build: .
    container_name: personal-health-dashboard
    env_file: .env
    environment:
      DASHBOARD_PRIVATE_ROOT: /data
      DASHBOARD_LOCAL_ONLY: "0"
    ports:
      - "127.0.0.1:18170:8000"
    volumes:
      - personal-health-data:/data
    networks:
      - personal-health
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 384m
    cpus: 0.75
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: 5m
        max-file: "2"
volumes:
  personal-health-data:
networks:
  personal-health:
